<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - QuizMaster</title>
<style>
  :root { --bg:#0b1020; --card:#131a30; --line:#26304f; --text:#e8ecf8; --muted:#8d98b8; --accent:#6c8cff; --danger:#ff6b7a; --ok:#4cd9a0; }
  :root[data-theme="light"] { --bg:#f3f5fb; --card:#ffffff; --line:#d9deee; --text:#151b30; --muted:#5d6786; --accent:#3d5afe; --danger:#d63048; --ok:#12945f; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .box { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .brand { font-size:1.3rem; font-weight:700; margin-bottom:4px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:.95rem; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:4px; margin-bottom:20px; }
  .tabs button { border:0; background:transparent; color:var(--muted); padding:9px; border-radius:7px; font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:#fff; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:9px; font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .submit { width:100%; margin-top:20px; padding:12px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .submit:disabled { opacity:.6; cursor:wait; }
  .msg { min-height:1.3em; margin:14px 0 0; font-size:.9rem; color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .hidden { display:none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
</head>
<body>
<main class="box">
  <div class="brand">🧠 QuizMaster</div>
  <p class="sub" id="sub">Log in to continue your quizzes.</p>

  <div class="tabs" role="tablist">
    <button type="button" id="tabLogin" class="active" role="tab">Log in</button>
    <button type="button" id="tabSignup" role="tab">Sign up</button>
  </div>

  <div id="nameRow" class="hidden">
    <label for="name">Full name</label>
    <input id="name" type="text" autocomplete="name">
  </div>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <div id="confirmRow" class="hidden">
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" autocomplete="new-password">
  </div>

  <button class="submit" id="submitBtn" type="button">Log in</button>
  <p class="msg" id="msg" role="alert"></p>
</main>

<script>
(function () {
  var mode = 'login';
  var busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function show(text, ok) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'msg' + (ok ? ' ok' : '');
  }

  // Match the theme used by the main app
  try {
    var t = localStorage.getItem('quizMasterTheme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (e) {}

  // Make sure Supabase loaded; otherwise show a clear message instead of crashing
  if (!window.supabase) {
    show('Supabase library did not load. Check your internet connection and the script line in login.html.');
    $('submitBtn').disabled = true;
    return;
  }
  if (!window.sb) {
    show('supabase-config.js is missing, has a typo in its name, or has an error.');
    $('submitBtn').disabled = true;
    return;
  }

  // Already logged in -> go to dashboard
  window.sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) location.replace('index.html');
  }).catch(function () {});

  function setMode(next) {
    mode = next;
    var signup = mode === 'signup';
    $('tabLogin').classList.toggle('active', !signup);
    $('tabSignup').classList.toggle('active', signup);
    $('nameRow').classList.toggle('hidden', !signup);
    $('confirmRow').classList.toggle('hidden', !signup);
    $('submitBtn').textContent = signup ? 'Create account' : 'Log in';
    $('sub').textContent = signup ? 'Create an account to save your scores.' : 'Log in to continue your quizzes.';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    show('');
  }

  async function submit() {
    if (busy) return;
    var email = $('email').value.trim().toLowerCase();
    var password = $('password').value;

    if (!/^\S+@\S+\.\S+$/.test(email)) return show('Enter a valid email address.');
    if (password.length < 6) return show('Password must be at least 6 characters.');

    var name = '';
    if (mode === 'signup') {
      name = $('name').value.trim();
      if (!name) return show('Enter your name.');
      if (password !== $('confirm').value) return show('Passwords do not match.');
    }

    busy = true;
    $('submitBtn').disabled = true;
    show('');

    try {
      if (mode === 'signup') {
        var up = await window.sb.auth.signUp({
          email: email,
          password: password,
          options: { data: { name: name } }
        });
        if (up.error) return show(up.error.message);

        if (up.data.session) {
          show('Account created. Redirecting...', true);
          setTimeout(function () { location.href = 'index.html'; }, 500);
        } else {
          show('Account created. Check your email and click the confirmation link, then log in.', true);
        }
      } else {
        var inn = await window.sb.auth.signInWithPassword({ email: email, password: password });
        if (inn.error) return show(inn.error.message);

        show('Logged in. Redirecting...', true);
        setTimeout(function () { location.href = 'index.html'; }, 400);
      }
    } catch (err) {
      show('Something went wrong. Check your internet connection and try again.');
    } finally {
      busy = false;
      $('submitBtn').disabled = false;
    }
  }

  $('tabLogin').addEventListener('click', function () { setMode('login'); });
  $('tabSignup').addEventListener('click', function () { setMode('signup'); });
  $('submitBtn').addEventListener('click', submit);
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
